$PSTR, 50004
192.168.0.47,192.168.0.48,127.0.0.1

=================================
line 1;  sig to use in UDP sentence
line 1;  after the comma is the UDP port to send to, which is 50004 by default in RaceGuide (if changed, then needs to be set in RaceGuide settings -> Comms
line 2;  remoteIP addresses csv list - best to address each client directly rather than broadcast for smooth data at 5Hz - set these to the IP of each Race Guide client e.g. 192.168.1.172,192.168.1.240